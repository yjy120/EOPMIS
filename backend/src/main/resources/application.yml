server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: eopmis-backend
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 用 [::1] 强制 IPv6 命中 MySQL 8.0（3306 上 MariaDB 占 IPv4，MySQL 8.0 占 IPv6）
    url: jdbc:mysql://[::1]:3306/eopmis?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: "YOUR_DB_PASSWORD"
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

  sql:
    init:
      # 多人共用 MySQL 时必须设为 never，否则谁重启后端谁 DROP TABLE 清库！
      # 首次搭库：手动执行一次 schema-rebuild.sql（仅一次）
      # 之后永远不自动重建，DataInitRunner 会自动补齐种子数据
      mode: never

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.eopmis.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: eopmis-jwt-secret-2026-please-replace-in-production-env-xxxxxxxxxxxxxxxxxx
  # 30 分钟（单位：毫秒）
  expiration: 1800000
  # 登录失败锁定 15 分钟
  lock-minutes: 15
  # 连续错误次数阈值
  max-fail-count: 5
  # 请求头
  header: Authorization
  # Token 前缀
  token-prefix: "Bearer "

# 日志审计
audit:
  enabled: true

# 密码策略
password:
  min-length: 8
  require-letter: true
  require-digit: true
  history-keep: 3
  # 初始密码（admin 新建账号时默认密码）
  initial: Init@123456
  # 启动时是否强制把种子账号（admin/hr01/emp01）的密码重置为默认值
  #   true：测试/演示环境友好，改坏了重启即恢复
  #   false：生产环境必须设为 false，避免改密后被悄悄重置
  force-reset-on-startup: true

logging:
  level:
    com.eopmis: debug
    org.springframework.security: info